[providers]
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npx esbuild src/index.ts --bundle=false --platform=node --target=node18 --format=cjs --outdir=dist"]

[start]
cmd = "node --max-old-space-size=4096 dist/index.js"
