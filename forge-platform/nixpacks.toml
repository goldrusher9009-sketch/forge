[providers]
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["NODE_OPTIONS='--max-old-space-size=8192' npx esbuild src/index.ts src/autonomy.ts src/hermes.ts src/operator.ts --bundle=false --platform=node --target=node18 --format=cjs --outdir=dist"]

[start]
cmd = "node --max-old-space-size=4096 dist/index.js"
