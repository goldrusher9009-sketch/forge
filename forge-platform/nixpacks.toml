[providers]
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["node_modules/.bin/esbuild src/index.ts --bundle=false --platform=node --outdir=dist --log-level=warning"]

[start]
cmd = "node --max-old-space-size=4096 dist/index.js"
