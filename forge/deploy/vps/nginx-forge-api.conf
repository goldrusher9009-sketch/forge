# /etc/nginx/sites-enabled/forge-api.135-148-52-149.sslip.io
# Forge backend (Express + SSE). TLS via certbot webroot.

server {
    listen 80;
    listen [::]:80;
    server_name forge-api.135-148-52-149.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forge-api.135-148-52-149.sslip.io;

    ssl_certificate /etc/letsencrypt/live/forge-api.135-148-52-149.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forge-api.135-148-52-149.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE: no buffering, long idle windows for agent runs
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800;
        proxy_send_timeout 1800;
    }
}
