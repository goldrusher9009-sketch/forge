[providers]
providers = ["node", "python"]

[phases.setup]
nixPkgs = ["python3", "make", "gcc", "nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npx tsc --skipLibCheck --noEmit false 2>&1 | tail -20 || true"]

[phases.start]
cmd = "node --max-old-space-size=1024 dist/index.js"
