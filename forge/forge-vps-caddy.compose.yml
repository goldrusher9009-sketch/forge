name: forge-private-candidate

# Public HTTPS edge for a dedicated Forge Docker host. Use together with
# forge-sandbox.compose.yml and forge-private-candidate.compose.yml.
services:
  forge-control-plane-proxy:
    image: docker.m.daocloud.io/library/caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set the ACME certificate contact email}
      FORGE_CONTROL_PLANE_DOMAIN: ${FORGE_CONTROL_PLANE_DOMAIN:?set the public control-plane hostname}
      FORGE_CONTROL_PLANE_GATEWAY_SECRET: ${FORGE_CONTROL_PLANE_GATEWAY_SECRET:?set the Vercel-to-control-plane gateway secret}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./forge-control-plane.Caddyfile:/etc/caddy/Caddyfile:ro
      - forge_caddy_data:/data
      - forge_caddy_config:/config
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      forge-platform:
        condition: service_healthy
    restart: unless-stopped

volumes:
  forge_caddy_data:
    name: forge-private-candidate-caddy-data
  forge_caddy_config:
    name: forge-private-candidate-caddy-config
