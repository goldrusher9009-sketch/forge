<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 360px; font-family: -apple-system, sans-serif; background: #0a0a0b; color: #f0f1f5; }
    .header { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
    .header h2 { margin: 0; font-size: 16px; }
    .content { padding: 16px; max-height: 400px; overflow-y: auto; }
    .input-area { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; padding: 8px 12px; background: #1a1a1e; border: 1px solid rgba(255,255,255,0.11); color: #fff; border-radius: 6px; font-size: 13px; }
    button { padding: 8px 16px; background: linear-gradient(135deg, #ff1f35, #cc1020); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .message { padding: 8px 12px; background: #131316; border-radius: 6px; margin-bottom: 8px; font-size: 12px; border-left: 2px solid #ff1f35; }
    .status { font-size: 12px; color: #9a9caa; padding: 8px 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚡ Forge</h2>
    <button onclick="chrome.runtime.openOptionsPage()" style="padding: 4px 8px; font-size: 11px;">⚙️</button>
  </div>
  <div class="content">
    <div class="input-area">
      <input id="prompt" type="text" placeholder="Ask Forge...">
      <button onclick="sendPrompt()">Send</button>
    </div>
    <div id="messages"></div>
    <div class="status">Ready to assist</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
